<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Verificación de Certificados o Informes</title>

<style>

/* ============================= */
/* CONFIGURACIÓN GENERAL */
/* ============================= */

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;
    height: 100%;
    font-family: Arial, Helvetica, sans-serif;
    background-color: #f5f5f5;
    color: #111;
}


/* ============================= */
/* BARRA SUPERIOR */
/* ============================= */

.header {
    width: 100%;
    height: 54px;
    background-color: #aa1d35;

    display: flex;
    align-items: center;

    padding-left: 29px;
}

.logo {
    color: #ffffff;

    font-size: 22px;
    font-weight: bold;
    font-style: italic;
}


/* ============================= */
/* CONTENIDO */
/* ============================= */

main {
    min-height: calc(100vh - 138px);
}

.contenedor {

    width: 60%;
    max-width: 1040px;

    margin: 29px auto 0 auto;
}


/* ============================= */
/* TÍTULO */
/* ============================= */

h1 {

    margin: 0 0 18px 0;

    font-size: 25px;

    font-weight: 700;

    color: #000000;
}


/* ============================= */
/* FORMULARIO */
/* ============================= */

.form-group {

    margin-bottom: 35px;
}

label {

    display: block;

    color: #b11a2c;

    font-size: 16px;

    margin-left: 14px;

    margin-bottom: 5px;
}


/* ============================= */
/* INPUT */
/* ============================= */

input {

    display: block;

    width: 100%;

    height: 51px;

    border: none;

    border-bottom: 1px solid #777777;

    background: #ffffff;

    padding: 0 14px;

    font-size: 14px;

    outline: none;
}

input:focus {

    border-bottom: 2px solid #aa1d35;
}


/* ============================= */
/* SELECT */
/* ============================= */

select {

    display: block;

    width: 100%;

    height: 51px;

    border: none;

    border-bottom: 1px solid #777777;

    background: #ffffff;

    padding: 0 14px;

    font-size: 14px;

    outline: none;

    cursor: pointer;
}


/* ============================= */
/* BOTÓN */
/* ============================= */

.boton-area {

    display: flex;

    justify-content: flex-end;

    margin-top: 38px;
}

button {

    background-color: #ac1c34;

    color: #ffffff;

    border: none;

    border-radius: 3px;

    padding: 10px 20px;

    font-size: 13px;

    font-weight: bold;

    letter-spacing: 0.7px;

    cursor: pointer;

    box-shadow: 0 2px 3px rgba(0,0,0,0.25);
}

button:hover {

    background-color: #91172b;
}


/* ============================= */
/* TEXTO INFERIOR */
/* ============================= */

.descripcion {

    margin: 30px 17px 0 17px;

    font-size: 12px;

    color: #111111;
}


/* ============================= */
/* RESULTADO */
/* ============================= */

#resultado {

    margin-top: 25px;
}


/* ============================= */
/* ERROR */
/* ============================= */

.error {

    background: #ffffff;

    border-left: 5px solid #aa1d35;

    padding: 16px;

    color: #990000;

    font-size: 14px;

    box-shadow: 0 1px 4px rgba(0,0,0,0.10);
}


/* ============================= */
/* CARGANDO */
/* ============================= */

.cargando {

    background: #ffffff;

    border-left: 5px solid #aa1d35;

    padding: 16px;

    color: #333333;

    font-size: 14px;
}


/* ============================= */
/* FOOTER */
/* ============================= */

footer {

    min-height: 84px;

    background-color: #66737b;

    color: #ffffff;

    display: flex;

    align-items: center;

    justify-content: space-between;

    padding: 0 17%;

    font-size: 12px;
}

.footer-logo {

    font-weight: bold;

    font-style: italic;

    font-size: 18px;

    opacity: 0.75;
}

.footer-centro {

    margin-top: 30px;
}

.footer-derecha {

    margin-top: 30px;
}


/* ============================= */
/* RESPONSIVE */
/* ============================= */

@media (max-width: 900px) {

    .contenedor {

        width: 88%;
    }

    footer {

        padding: 20px 6%;

        flex-direction: column;

        align-items: flex-start;
    }

    .footer-centro,
    .footer-derecha {

        margin-top: 10px;
    }
}

</style>

</head>


<body>


<!-- ============================= -->
<!-- ENCABEZADO -->
<!-- ============================= -->

<header class="header">

    <div class="logo">
        EQUIFAX
    </div>

</header>



<!-- ============================= -->
<!-- CONTENIDO -->
<!-- ============================= -->

<main>

<div class="contenedor">


    <h1>
        Verificación de Certificados o Informes
    </h1>



    <!-- NÚMERO CERTIFICADO -->

    <div class="form-group">

        <label for="codigo">
            N° de Certificado:*
        </label>

        <input
            type="text"
            id="codigo"
            placeholder="Ingrese número de certificado"
            autocomplete="off"
        >

    </div>



    <!-- PAÍS -->

    <div class="form-group">

        <label for="pais">
            País:*
        </label>

        <select id="pais">

            <option value="">
                --Seleccione--
            </option>

            <option value="Chile">
                Chile
            </option>

        </select>

    </div>



    <!-- BOTÓN -->

    <div class="boton-area">

        <button
            type="button"
            onclick="consultar()"
        >
            Consultar
        </button>

    </div>



    <!-- TEXTO -->

    <div class="descripcion">

        A través de Certificados, puedes verificar los documentos
        que han sido almacenados en esta plataforma mediante
        su número de verificación.

    </div>



    <!-- RESULTADOS -->

    <div id="resultado"></div>


</div>

</main>



<!-- ============================= -->
<!-- PIE DE PÁGINA -->
<!-- ============================= -->

<footer>

    <div class="footer-logo">

        EQUIFAX

    </div>


    <div class="footer-centro">

        Copyright 2026.
        Todos los derechos reservados.

    </div>


    <div class="footer-derecha">

        Servicio al Cliente 60-3784329

    </div>

</footer>



<!-- ============================= -->
<!-- JAVASCRIPT -->
<!-- ============================= -->

<script>


/*
====================================
BASE DE DATOS DE DOCUMENTOS
====================================
*/


const documentos = {


    /*
    DOCUMENTO 1
    */

    "355ca3df-bf67-4db5-9bac-5c6bfbc6b5a4": {

        archivo:
        "Informe Empresarial Dicom 16 abril 26.pdf",

        pais:
        "Chile"

    }


};



/*
====================================
FUNCIÓN CONSULTAR
====================================
*/


function consultar() {


    /*
    Obtener código ingresado
    */

    const codigo = document
        .getElementById("codigo")
        .value
        .trim()
        .toLowerCase();


    /*
    Obtener país
    */

    const pais = document
        .getElementById("pais")
        .value;


    /*
    Zona donde aparecen mensajes
    */

    const resultado = document
        .getElementById("resultado");



    /*
    Validar código vacío
    */

    if (codigo === "") {


        resultado.innerHTML = `

            <div class="error">

                Debe ingresar un número de certificado.

            </div>

        `;


        return;

    }



    /*
    Validar país
    */

    if (pais === "") {


        resultado.innerHTML = `

            <div class="error">

                Debe seleccionar el país.

            </div>

        `;


        return;

    }



    /*
    Buscar documento
    */

    const documento =
        documentos[codigo];



    /*
    Código inexistente
    */

    if (!documento) {


        resultado.innerHTML = `

            <div class="error">

                No se encontraron registros para
                el número de certificado ingresado.

            </div>

        `;


        return;

    }



    /*
    Validar país
    */

    if (documento.pais !== pais) {


        resultado.innerHTML = `

            <div class="error">

                El certificado ingresado no corresponde
                al país seleccionado.

            </div>

        `;


        return;

    }



    /*
    Mostrar mensaje
    */

    resultado.innerHTML = `

        <div class="cargando">

            Documento encontrado.

            Abriendo documento...

        </div>

    `;



    /*
    ABRIR PDF
    */

    window.open(

        documento.archivo,

        "_blank"

    );


}



/*
====================================
PERMITIR CONSULTAR CON ENTER
====================================
*/


document
    .getElementById("codigo")
    .addEventListener(
        "keydown",

        function(event) {


            if (event.key === "Enter") {

                consultar();

            }

        }

    );


</script>


</body>
